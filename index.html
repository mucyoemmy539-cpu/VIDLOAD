<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Downloader</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="navbar">
    <div class="logo">VID<span>LOAD</span></div>
  </header>

  <main class="hero">
    <h1>Download Videos</h1>

    <p class="subtitle">
      Paste a video link and download it easily.
    </p>

    <div class="download-box">
      <input
        type="url"
        id="videoUrl"
        placeholder="Paste video URL here..."
        autocomplete="off"
      >

      <button id="downloadBtn">
        Download
      </button>
    </div>

    <p id="message"></p>
  </main>

  <footer>
    <p>© 2026 VIDLOAD</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
